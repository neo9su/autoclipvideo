services:
  app:
    profiles: ["gpu-backend"]
    build: .
    container_name: autoclipvideo
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:8899:8899"
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./voice_output:/app/voice_output
    environment:
      - GPU_SERVICE_URL=${GPU_SERVICE_URL:?GPU_SERVICE_URL must point to the GPU worker}
      - COMFYUI_URL=${COMFYUI_URL:?COMFYUI_URL must point to the GPU vision service}
      - WATCHDOG_URL=${WATCHDOG_URL:?WATCHDOG_URL must point to the remote watchdog}
      - GPU_EXECUTION_NODE=${GPU_EXECUTION_NODE:-remote-gpu}
      - DEPLOYMENT_ROLE=gpu-backend
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - MAX_CONCURRENT_CLIPS=${MAX_CONCURRENT_CLIPS:-1}
      - MEM_WARN_GB=${MEM_WARN_GB:-5}
      - COSYVOICE_URL=${COSYVOICE_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  # This profile is for the GPU server only. The control-plane host must not run it.
  # GPU service runs natively on the GPU server (not in this container).
